name: Notify PR Author of Unresolved Bot Review Threads
description: Notify a pull request author about unresolved automated reviewer (bot) threads after all reviewers approve
author: kreuz123
branding:
  icon: message-circle
  color: blue

inputs:
  token:
    description: GitHub token for API access
    required: false
  pr-number:
    description: Pull request number
    required: false
  all-approved:
    description: Whether the independent check-all-reviewers-approved action found all reviewers approved
    required: false
    default: "true"
  comment-template:
    description: Template for the notification comment. Supports the placeholders {author}, {unresolvedCount}, and {threadList}. If {threadList} is omitted, the thread list is appended automatically.
    required: false
    default: "All reviewers have approved this PR! 🎉\n\nHowever, there are {unresolvedCount} unresolved review thread(s) started by an automated reviewer (e.g. Copilot) that need your attention. Please resolve these conversations.\n\n**Unresolved automated review threads:**\n\n{threadList}"

outputs:
  has-unresolved:
    description: Whether unresolved bot review threads were found
  unresolved-count:
    description: Number of unresolved bot review threads
  thread-list:
    description: Markdown list of unresolved bot review threads

runs:
  using: node24
  main: dist/index.js
